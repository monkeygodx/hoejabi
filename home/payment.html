<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Payment — HOEJABIHAVEN</title>
  <meta http-equiv="refresh" content="0;url=https://mycheckout.live"/>
  <style>
    :root{--bg:#070709;--text:#f2f2f6;--text-muted:#70708a;--a3:#e0e6ff;--grad:linear-gradient(135deg,#ffffff 0%,#b8c4ff 100%);--font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:32px;}
    h1{font-size:1.5rem;font-weight:800;margin-bottom:12px;}
    p{color:var(--text-muted);font-size:14px;margin-bottom:24px;}
    a{display:inline-block;background:var(--grad);color:#0a0a12;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:800;text-decoration:none;}
  </style>
</head>
<body>
  <div>
    <h1>Redirecting to Checkout</h1>
    <p>Payments are processed at mycheckout.live. Taking you there now.</p>
    <a href="https://mycheckout.live">Go to Checkout →</a>
  </div>
</body>
</html>
